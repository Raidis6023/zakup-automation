# First stage: web container only. No database, cron or public exposure yet.
# Use: docker compose --env-file .env.docker config
name: panda

services:
  panda-web:
    image: panda-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env.docker}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .env.docker}
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      INTERNAL_APP_URL: http://panda-web:3000
    # The HTTPS reverse proxy will be deployed separately on the same host.
    # Do not expose the application directly to the internet at this stage.
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - panda_next_cache:/app/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode>=200&&r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  panda_next_cache:
