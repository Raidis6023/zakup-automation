name: Main TypeScript Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify all relative CSS imports exist
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, existsSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          const roots = ['app', 'lib', 'components', 'scripts'];
          const extensions = /\.(?:tsx?|jsx?|mjs|cjs)$/;
          const imports = /\b(?:import\s*(?:[^'"\n]*?\s+from\s*)?|require\s*\()\s*['"](\.[^'"]+\.css)['"]/g;
          const errors = [];
          function visit(dir) {
            if (!existsSync(dir)) return;
            for (const e of readdirSync(dir, { withFileTypes: true })) {
              const target = join(dir, e.name);
              if (e.isDirectory()) {
                if (!['node_modules', '.next', '.git'].includes(e.name)) visit(target);
              } else if (e.isFile() && extensions.test(e.name)) {
                const content = readFileSync(target, 'utf8');
                for (const m of content.matchAll(imports)) {
                  const imported = resolve(dirname(target), m[1]);
                  if (!existsSync(imported)) errors.push(target + ' -> ' + m[1]);
                }
              }
            }
          }
          for (const root of roots) visit(root);
          if (errors.length) {
            console.error('Missing CSS imports:\n' + errors.join('\n'));
            process.exit(1);
          }
          console.log('All relative CSS imports resolve.');
          NODE

      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
