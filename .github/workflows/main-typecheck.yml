name: Main TypeScript Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write # temporary, removed after vendoring finishes

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Vendor verified SheetJS package for offline builds (one-time)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/vendor-sheetjs-tarball-20261028' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          if [ ! -f vendor/xlsx-0.20.3.tgz ]; then
            mkdir -p vendor
            file="vendor/xlsx-0.20.3.tgz"
            for url in "https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz" "https://sheet.lol/balls/xlsx-0.20.3.tgz"; do
              if curl --fail --location --retry 2 --retry-all-errors --connect-timeout 12 --max-time 50 "$url" -o "$file"; then
                break
              fi
            done
            test -s "$file"
            node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const expected='sha512-oLDq3jw7AcLqKWH2AhCpVTZl8mf6X2YReP+Neh0SJUzV/BdZYjth94tG5toiMB1PPrYtxOCfaoUCkvtuH+3AJA==';
          const actual='sha512-'+createHash('sha512').update(readFileSync('vendor/xlsx-0.20.3.tgz')).digest('base64');
          if (actual !== expected) throw Error('SheetJS tarball SHA512 differs from pinned lockfile');
          console.log('Verified SheetJS 0.20.3 integrity.');
          NODE
            npm pkg set dependencies.xlsx="file:vendor/xlsx-0.20.3.tgz"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json "$file"
            git commit -m "fix(deps): vendor verified SheetJS 0.20.3 archive"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify all relative CSS imports exist
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, existsSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          const roots = ['app', 'lib', 'components', 'scripts'];
          const extensions = /\.(?:tsx?|jsx?|mjs|cjs)$/;
          const imports = /\b(?:import\s*(?:[^'"\n]*?\s+from\s*)?|require\s*\()\s*['"](\.[^'"]+\.css)['"]/g;
          const errors = [];
          function visit(dir) {
            if (!existsSync(dir)) return;
            for (const e of readdirSync(dir, { withFileTypes: true })) {
              const target = join(dir, e.name);
              if (e.isDirectory()) {
                if (!['node_modules', '.next', '.git'].includes(e.name)) visit(target);
              } else if (e.isFile() && extensions.test(e.name)) {
                const content = readFileSync(target, 'utf8');
                for (const m of content.matchAll(imports)) {
                  const imported = resolve(dirname(target), m[1]);
                  if (!existsSync(imported)) errors.push(target + ' -> ' + m[1]);
                }
              }
            }
          }
          for (const root of roots) visit(root);
          if (errors.length) {
            console.error('Missing CSS imports:\n' + errors.join('\n'));
            process.exit(1);
          }
          console.log('All relative CSS imports resolve.');
          NODE

      - name: TypeScript check
        run: npx tsc --noEmit --pretty false

      # A clean Next build also validates CSS imports and asset resolution,
      # which TypeScript alone cannot detect. No Vercel quota consumed here.
      - name: Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Non-production placeholders. No real Supabase credentials or URLs
          # are used by GitHub Actions; Vercel has separate runtime values.
          NEXT_PUBLIC_SUPABASE_URL: "https://supabase-ci.invalid"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
