name: Panda Docker migration checks

on:
  push:
    branches:
      - migration/docker
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Create isolated dummy configuration
        shell: bash
        run: |
          cat > .env.docker <<'ENV'
          NEXT_PUBLIC_SUPABASE_URL=https://example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-non-secret-placeholder
          SUPABASE_SECRET_KEY=ci-non-secret-placeholder
          CRON_SECRET=ci-non-secret-placeholder
          ENV
          chmod 600 .env.docker

      - name: Validate Compose configuration
        run: docker compose --env-file .env.docker config --quiet

      - name: Validate migration guardrails
        run: node scripts/docker-migration-regression.test.cjs

      - name: Validate database dump safety without any real data
        run: |
          node --check scripts/storage-dump-preflight.mjs
          node scripts/storage-dump-preflight.test.mjs

      - name: Verify marketplace keys remain admin-managed
        run: node scripts/docker-credentials-regression.test.cjs

      - name: Validate scheduled jobs without starting them
        run: node scripts/docker-scheduler.test.mjs

      - name: Check infrastructure scripts and security guardrails
        run: |
          bash -n infra/supabase/prepare.sh
          bash -n infra/migration/disposable-backup-smoke.sh
          bash -n infra/backup/backup.sh
          bash -n infra/backup/verify-bundle.sh
          bash -n infra/migration/check-migration-baseline.sh
          node --check infra/migration/panda-connected-smoke.mjs
          node --check infra/docker/entrypoint.mjs
          node --check infra/scheduler/schedule.mjs
          node --check infra/scheduler/runner.mjs
          node scripts/docker-infra-regression.test.cjs

      - name: Validate protected server overlays
        shell: bash
        run: |
          mkdir -p .ci-secrets
          printf 'not-a-real-key\n' > .ci-secrets/supabase-secret-key
          printf 'not-a-real-secret-just-ci-validation-value\n' > .ci-secrets/cron-secret
          PANDA_SECRETS_DIR="$GITHUB_WORKSPACE/.ci-secrets" \
            docker compose -f compose.yaml -f compose.server.yaml \
              -f compose.scheduler.yaml --env-file .env.docker config --quiet

      - name: Check official self-hosted database network isolation
        shell: bash
        run: |
          bash infra/supabase/prepare.sh "$GITHUB_WORKSPACE/.panda-local/supabase"
          cd .panda-local/supabase
          docker compose -f docker-compose.yml -f docker-compose.panda.yml \
            --env-file .env config --format json > "$RUNNER_TEMP/supabase-resolved.json"
          node - "$RUNNER_TEMP/supabase-resolved.json" <<'NODE'
          const fs = require("fs");
          const cfg = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const allowed = { "api-gw": ["8000"], "supavisor": ["5432", "6543"] };
          for (const [name, service] of Object.entries(cfg.services ?? {})) {
            const ports = service.ports ?? [];
            const expected = allowed[name] ?? [];
            if (ports.length !== expected.length) throw Error(name + ": unexpected public ports");
            for (const port of ports) {
              if (port.host_ip !== "127.0.0.1" ||
                  !expected.includes(String(port.published))) {
                throw Error(name + ": non-loopback or unexpected published port");
              }
            }
          }
          console.log("PASS: official Supabase database ports exposed only on localhost");
          NODE

      - name: Boot disposable PostgreSQL, Auth, REST and private Storage
        shell: bash
        run: |
          # GitHub-only test: no production credentials and no cloud project.
          export PANDA_SECRETS_DIR="$GITHUB_WORKSPACE/.ci-secrets"
          docker network create panda_shared
          cp "$GITHUB_WORKSPACE/infra/supabase/docker-compose.smoke.yml" .panda-local/supabase/docker-compose.smoke.yml
          cd .panda-local/supabase
          umask 077
          sh utils/generate-keys.sh --update-env > /dev/null
          sh utils/add-new-auth-keys.sh --update-env > /dev/null
          rm -f .env.old
          # No public signup on the test database; create a synthetic user via admin.
          sed -i 's/^DISABLE_SIGNUP=.*/DISABLE_SIGNUP=true/' .env
          cleanup() {
            # Tear down web first so its private network dependency is released.
            docker compose -f "$GITHUB_WORKSPACE/compose.yaml" \
              -f "$GITHUB_WORKSPACE/compose.server.yaml" \
              --env-file "$GITHUB_WORKSPACE/.env.docker" \
              down --volumes --remove-orphans || true
            cd "$GITHUB_WORKSPACE/.panda-local/supabase"
            docker compose -f docker-compose.yml -f docker-compose.panda.yml \
              -f docker-compose.smoke.yml --env-file .env down --volumes --remove-orphans || true
            docker network rm panda_shared || true
          }
          trap cleanup EXIT
          timeout 300s docker compose -f docker-compose.yml -f docker-compose.panda.yml \
            -f docker-compose.smoke.yml --env-file .env up -d --wait api-gw
          docker compose -f docker-compose.yml -f docker-compose.panda.yml \
            -f docker-compose.smoke.yml --env-file .env exec -T db \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "$GITHUB_WORKSPACE/infra/migration/selfhost-postgres-smoke.sql"
          node "$GITHUB_WORKSPACE/infra/migration/supabase-stack-smoke.mjs" \
            .env "$RUNNER_TEMP/panda-ci-persistence.json"

          # A restart must keep database rows and private file bytes intact.
          # NEVER use down --volumes for this test.
          docker compose -f docker-compose.yml -f docker-compose.panda.yml \
            -f docker-compose.smoke.yml --env-file .env stop \
            api-gw auth rest storage imgproxy db
          timeout 180s docker compose -f docker-compose.yml -f docker-compose.panda.yml \
            -f docker-compose.smoke.yml --env-file .env up -d --wait api-gw
          node "$GITHUB_WORKSPACE/infra/migration/supabase-persistence-smoke.mjs" \
            .env "$RUNNER_TEMP/panda-ci-persistence.json"
          rm -f "$RUNNER_TEMP/panda-ci-persistence.json"

          # A disposable full-stack test confirms that PostgreSQL backup
          # files are actually restorable, not merely created.
          PANDA_CI_DISPOSABLE=yes \
            bash "$GITHUB_WORKSPACE/infra/migration/disposable-backup-smoke.sh"

          # Prove that the existing 85+ SQL migration files are incremental.
          # A fresh blank database requires a safe full schema export first.
          PANDA_CI_DISPOSABLE=yes \
            bash "$GITHUB_WORKSPACE/infra/migration/check-migration-baseline.sh"

          # Exercise the actual Panda web image against the same isolated
          # official Supabase Auth/REST/Storage installation.
          publishable="$(sed -n 's/^SUPABASE_PUBLISHABLE_KEY=//p' .env | tail -1)"
          service="$(sed -n 's/^SUPABASE_SECRET_KEY=//p' .env | tail -1)"
          test -n "$publishable" && test -n "$service"
          one_c_token="$(openssl rand -hex 32)"
          one_c_hash="$(printf '%s' "$one_c_token" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$one_c_token" > "$RUNNER_TEMP/panda-ci-1c-token"
          chmod 600 "$RUNNER_TEMP/panda-ci-1c-token"
          printf '%s\n' "$service" > "$PANDA_SECRETS_DIR/supabase-secret-key"
          openssl rand -hex 32 > "$PANDA_SECRETS_DIR/cron-secret"
          sudo chgrp 1000 "$PANDA_SECRETS_DIR/supabase-secret-key" "$PANDA_SECRETS_DIR/cron-secret"
          chmod 640 "$PANDA_SECRETS_DIR/supabase-secret-key" "$PANDA_SECRETS_DIR/cron-secret"
          cat > "$GITHUB_WORKSPACE/.env.docker" <<ENV
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable
          ONE_C_API_KEY_SHA256=$one_c_hash
          ENV
          chmod 600 "$GITHUB_WORKSPACE/.env.docker"
          cd "$GITHUB_WORKSPACE"
          docker compose -f compose.yaml -f compose.server.yaml \
            --env-file .env.docker build --progress plain panda-web
          docker compose -f compose.yaml -f compose.server.yaml \
            --env-file .env.docker up -d --no-build --wait panda-web

          # Panda must be able to find the private gateway from its container.
          docker compose -f compose.yaml -f compose.server.yaml \
            --env-file .env.docker exec -T panda-web node -e \
            "fetch('http://supabase-gateway:8000/auth/v1/health',{headers:{apikey:process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
          node infra/migration/panda-connected-smoke.mjs "$RUNNER_TEMP/panda-ci-1c-token"
          rm -f "$RUNNER_TEMP/panda-ci-1c-token"

          # Full encrypted backup rehearsal using ONLY synthetic local data.
          # The production script normally refuses local repositories.
          # This exception works exclusively inside the disposable CI runner.
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic >/dev/null
          export RESTIC_REPOSITORY="$RUNNER_TEMP/panda-restic-repo"
          export RESTIC_PASSWORD_FILE="$RUNNER_TEMP/panda-restic-password"
          openssl rand -hex 32 > "$RESTIC_PASSWORD_FILE"
          chmod 600 "$RESTIC_PASSWORD_FILE"
          sudo -E restic init >/dev/null
          sudo -E env PANDA_CI_DISPOSABLE=yes PANDA_WRITES_PAUSED=YES \
            PANDA_SUPABASE_DIR="$GITHUB_WORKSPACE/.panda-local/supabase" \
            PANDA_APP_DIR="$GITHUB_WORKSPACE" \
            PANDA_SECRETS_DIR="$PANDA_SECRETS_DIR" \
            PANDA_BACKUP_STAGE_DIR="$RUNNER_TEMP" \
            bash "$GITHUB_WORKSPACE/infra/backup/backup.sh"
          sudo -E restic check >/dev/null
          sudo -E restic restore latest --target "$RUNNER_TEMP/panda-restored" >/dev/null
          restored_dump="$(sudo find "$RUNNER_TEMP/panda-restored" -type f -name postgres.dump -print -quit)"
          test -n "$restored_dump"
          bundle="$(dirname "$restored_dump")"
          sudo bash "$GITHUB_WORKSPACE/infra/backup/verify-bundle.sh" "$bundle"
          docker compose -f compose.yaml -f compose.server.yaml --env-file .env.docker \
            exec -T panda-web node -e "process.exit(0)"
          echo "PASS: encrypted full backup created, repository checked and all components restored"

      - name: Build image with complete regression suite
        run: docker compose --env-file .env.docker build --progress plain panda-web

      - name: Start isolated web container
        run: docker compose --env-file .env.docker up -d --no-build panda-web

      - name: Smoke-check login page
        shell: bash
        run: |
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null --max-time 5 http://127.0.0.1:3000/login; then
              healthy=1
              break
            fi
            sleep 3
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose --env-file .env.docker logs --tail=100 panda-web
            exit 1
          fi

      - name: Container status
        run: docker compose --env-file .env.docker ps

      - name: Clean up isolated containers
        if: always()
        shell: bash
        run: |
          docker compose --env-file .env.docker logs --tail=80 panda-web || true
          docker compose --env-file .env.docker down --volumes --remove-orphans || true
