name: Panda Docker migration checks

on:
  push:
    branches:
      - migration/docker
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Create isolated dummy configuration
        shell: bash
        run: |
          cat > .env.docker <<'ENV'
          NEXT_PUBLIC_SUPABASE_URL=https://example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-non-secret-placeholder
          SUPABASE_SECRET_KEY=ci-non-secret-placeholder
          CRON_SECRET=ci-non-secret-placeholder
          ENV
          chmod 600 .env.docker

      - name: Validate Compose configuration
        run: docker compose --env-file .env.docker config --quiet

      - name: Validate migration guardrails
        run: node scripts/docker-migration-regression.test.cjs

      - name: Validate database dump safety without any real data
        run: |
          node --check scripts/storage-dump-preflight.mjs
          node scripts/storage-dump-preflight.test.mjs

      - name: Verify marketplace keys remain admin-managed
        run: node scripts/docker-credentials-regression.test.cjs

      - name: Validate scheduled jobs without starting them
        run: node scripts/docker-scheduler.test.mjs

      - name: Check infrastructure scripts and security guardrails
        run: |
          bash -n infra/supabase/prepare.sh
          node --check infra/docker/entrypoint.mjs
          node --check infra/scheduler/schedule.mjs
          node --check infra/scheduler/runner.mjs
          node scripts/docker-infra-regression.test.cjs

      - name: Validate protected server overlays
        shell: bash
        run: |
          mkdir -p .ci-secrets
          printf 'not-a-real-key\n' > .ci-secrets/supabase-secret-key
          printf 'not-a-real-secret-just-ci-validation-value\n' > .ci-secrets/cron-secret
          PANDA_SECRETS_DIR="$GITHUB_WORKSPACE/.ci-secrets" \
            docker compose -f compose.yaml -f compose.server.yaml \
              -f compose.scheduler.yaml --env-file .env.docker config --quiet

      - name: Check official self-hosted database network isolation
        shell: bash
        run: |
          bash infra/supabase/prepare.sh "$GITHUB_WORKSPACE/.panda-local/supabase"
          cd .panda-local/supabase
          docker compose -f docker-compose.yml -f docker-compose.panda.yml \
            --env-file .env config --format json > "$RUNNER_TEMP/supabase-resolved.json"
          node - "$RUNNER_TEMP/supabase-resolved.json" <<'NODE'
          const fs = require("fs");
          const cfg = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const allowed = { "api-gw": ["8000"], "supavisor": ["5432", "6543"] };
          for (const [name, service] of Object.entries(cfg.services ?? {})) {
            const ports = service.ports ?? [];
            const expected = allowed[name] ?? [];
            if (ports.length !== expected.length) throw Error(name + ": unexpected public ports");
            for (const port of ports) {
              if (port.host_ip !== "127.0.0.1" ||
                  !expected.includes(String(port.published))) {
                throw Error(name + ": non-loopback or unexpected published port");
              }
            }
          }
          console.log("PASS: official Supabase database ports exposed only on localhost");
          NODE

      - name: Boot disposable PostgreSQL, Auth, REST and private Storage
        shell: bash
        run: |
          # GitHub-only test: no production credentials and no cloud project.
          docker network create panda_shared
          cd .panda-local/supabase
          umask 077
          sh utils/generate-keys.sh --update-env > /dev/null
          sh utils/add-new-auth-keys.sh --update-env > /dev/null
          rm -f .env.old
          # No public signup on the test database; create a synthetic user via admin.
          sed -i 's/^DISABLE_SIGNUP=.*/DISABLE_SIGNUP=true/' .env
          cleanup() {
            docker compose -f docker-compose.yml -f docker-compose.panda.yml \
              -f docker-compose.smoke.yml --env-file .env down --volumes --remove-orphans || true
            docker network rm panda_shared || true
          }
          trap cleanup EXIT
          timeout 300s docker compose -f docker-compose.yml -f docker-compose.panda.yml \
            -f docker-compose.smoke.yml --env-file .env up -d --wait api-gw
          docker compose -f docker-compose.yml -f docker-compose.panda.yml \
            -f docker-compose.smoke.yml --env-file .env exec -T db \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "$GITHUB_WORKSPACE/infra/migration/selfhost-postgres-smoke.sql"
          node "$GITHUB_WORKSPACE/infra/migration/supabase-stack-smoke.mjs" .env

      - name: Build image with complete regression suite
        run: docker compose --env-file .env.docker build --progress plain panda-web

      - name: Start isolated web container
        run: docker compose --env-file .env.docker up -d --no-build panda-web

      - name: Smoke-check login page
        shell: bash
        run: |
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null --max-time 5 http://127.0.0.1:3000/login; then
              healthy=1
              break
            fi
            sleep 3
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose --env-file .env.docker logs --tail=100 panda-web
            exit 1
          fi

      - name: Container status
        run: docker compose --env-file .env.docker ps

      - name: Clean up isolated containers
        if: always()
        shell: bash
        run: |
          docker compose --env-file .env.docker logs --tail=80 panda-web || true
          docker compose --env-file .env.docker down --volumes --remove-orphans || true
