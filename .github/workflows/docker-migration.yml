name: Panda Docker migration checks

on:
  push:
    branches:
      - migration/docker
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Create isolated dummy configuration
        shell: bash
        run: |
          cat > .env.docker <<'ENV'
          NEXT_PUBLIC_SUPABASE_URL=https://example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-non-secret-placeholder
          SUPABASE_SECRET_KEY=ci-non-secret-placeholder
          CRON_SECRET=ci-non-secret-placeholder
          ENV
          chmod 600 .env.docker

      - name: Validate Compose configuration
        run: docker compose --env-file .env.docker config --quiet

      - name: Validate migration guardrails
        run: node scripts/docker-migration-regression.test.cjs

      - name: Validate scheduled jobs without starting them
        run: node scripts/docker-scheduler.test.mjs

      - name: Check infrastructure scripts and security guardrails
        run: |
          bash -n infra/supabase/prepare.sh
          node --check infra/docker/entrypoint.mjs
          node --check infra/scheduler/schedule.mjs
          node --check infra/scheduler/runner.mjs
          node scripts/docker-infra-regression.test.cjs

      - name: Validate protected server overlays
        shell: bash
        run: |
          mkdir -p .ci-secrets
          printf 'not-a-real-key\n' > .ci-secrets/supabase-secret-key
          printf 'not-a-real-secret-just-ci-validation-value\n' > .ci-secrets/cron-secret
          PANDA_SECRETS_DIR="$GITHUB_WORKSPACE/.ci-secrets" \
            docker compose -f compose.yaml -f compose.server.yaml \
              -f compose.scheduler.yaml --env-file .env.docker config --quiet

      - name: Build image with complete regression suite
        run: docker compose --env-file .env.docker build --progress plain panda-web

      - name: Start isolated web container
        run: docker compose --env-file .env.docker up -d --no-build panda-web

      - name: Smoke-check login page
        shell: bash
        run: |
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null --max-time 5 http://127.0.0.1:3000/login; then
              healthy=1
              break
            fi
            sleep 3
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose --env-file .env.docker logs --tail=100 panda-web
            exit 1
          fi

      - name: Container status
        run: docker compose --env-file .env.docker ps

      - name: Clean up isolated containers
        if: always()
        shell: bash
        run: |
          docker compose --env-file .env.docker logs --tail=80 panda-web || true
          docker compose --env-file .env.docker down --volumes --remove-orphans || true
