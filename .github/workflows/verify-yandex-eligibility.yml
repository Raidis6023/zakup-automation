name: Verify Yandex FBY Eligibility
on:
  push:
    branches: [feature/yandex-fby-eligibility-precheck]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund
      - run: npx tsc --noEmit --pretty false
