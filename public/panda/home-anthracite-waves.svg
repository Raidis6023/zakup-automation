  <!-- Keep the exact approved first arc geometry. -->
  <path d="M 660 752 C 880 735 1045 714 1180 667 C 1430 580 1565 422 1940 404" fill="none" stroke="#6e7f8b" stroke-opacity=".18" stroke-width="14" filter="url(#soft-arc-glow)"/>
