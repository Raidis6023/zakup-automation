<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="715" viewBox="0 0 1920 715" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="anthracite-flow-main" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#101820" stop-opacity="0"/>
      <stop offset="29%" stop-color="#101820" stop-opacity=".16"/>
      <stop offset="52%" stop-color="#101820" stop-opacity=".40"/>
      <stop offset="77%" stop-color="#101820" stop-opacity=".53"/>
      <stop offset="100%" stop-color="#101820" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="anthracite-flow-soft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#101820" stop-opacity="0"/>
      <stop offset="38%" stop-color="#101820" stop-opacity=".08"/>
      <stop offset="79%" stop-color="#101820" stop-opacity=".27"/>
      <stop offset="100%" stop-color="#101820" stop-opacity=".13"/>
    </linearGradient>
    <filter id="soft-arc-glow" x="-5%" y="-130%" width="110%" height="360%">
