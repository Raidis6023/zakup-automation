  <!-- Second parallel arc rises from the bottom toward the assistant. -->
  <path d="M 1080 755 C 1260 719 1362 665 1505 630 C 1675 583 1820 600 1950 632" fill="none" stroke="#718396" stroke-opacity=".12" stroke-width="12" filter="url(#soft-arc-glow)"/>
  <path d="M 1080 755 C 1260 719 1362 665 1505 630 C 1675 583 1820 600 1950 632" fill="none" stroke="url(#anthracite-flow-soft)" stroke-width="1.35" stroke-linecap="round"/>
</svg>