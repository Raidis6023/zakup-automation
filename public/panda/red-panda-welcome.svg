<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" role="img" aria-labelledby="title">
<title id="title">Красная панда в деловом костюме машет лапой и проверяет папку</title>
<defs>
 <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35404b"/><stop offset=".48" stop-color="#1b222c"/><stop offset="1" stop-color="#111720"/></linearGradient>
 <linearGradient id="fur" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#f6a357"/><stop offset=".48" stop-color="#dc7035"/><stop offset="1" stop-color="#a94327"/></linearGradient>
 <linearGradient id="whiteFur" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff3da"/><stop offset="1" stop-color="#eed5ac"/></linearGradient>
 <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fa9c52"/><stop offset="1" stop-color="#b14a2c"/></linearGradient>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<style><![CDATA[
.panda-body{animation:rise 2s ease-out both,breathe 5.2s ease-in-out 2s infinite;transform-origin:210px 465px}
.panda-head{animation:headUp 2.3s ease-out both;transform-origin:205px 245px}
.panda-wave{animation:wave 3.2s ease-in-out .25s both;transform-origin:138px 323px}
.panda-tail{animation:wag 4.7s ease-in-out infinite;transform-origin:283px 415px}
.panda-eye{animation:blink 6s ease-in-out 4.2s infinite;transform-origin:center;transform-box:fill-box}
.panda-folder{animation:folder 3.4s ease-in-out 2.8s both;transform-origin:304px 362px}
.panda-check{stroke-dasharray:64;stroke-dashoffset:64;animation:check 1s ease-out 4.55s both}
@keyframes rise{0%{transform:translateY(17px) scaleY(.965)}55%{transform:translateY(-8px) scaleY(1.012)}100%{transform:translateY(0) scaleY(1)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes headUp{0%{transform:rotate(-9deg) translateY(8px)}55%{transform:rotate(4deg)}100%{transform:rotate(0)}}
@keyframes wave{0%,4%,84%,100%{transform:rotate(0)}14%,34%,54%{transform:rotate(-22deg)}24%,44%,64%{transform:rotate(16deg)}}
@keyframes wag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(9deg)}}
@keyframes blink{0%,5%,9%,100%{transform:scaleY(1)}7%{transform:scaleY(.08)}}
@keyframes folder{0%,15%{transform:rotate(0)}32%,65%{transform:rotate(-8deg) translate(-3px,-5px)}100%{transform:rotate(0)}}
@keyframes check{from{stroke-dashoffset:64}to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.panda-check{stroke-dashoffset:0}}
]]></style>
