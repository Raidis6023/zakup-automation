# Apply only after the official Supabase stack is configured and tested.
# docker compose -f compose.yaml -f compose.server.yaml --env-file .env.docker config
services:
  panda-web:
    networks:
      - default
      - panda_shared
    environment:
      # Browser continues to use NEXT_PUBLIC_SUPABASE_URL=https://public-address.
      # Server-side traffic stays inside Docker and bypasses NAT hairpin issues.
      SUPABASE_INTERNAL_URL: http://supabase-gateway:8000

networks:
  panda_shared:
    name: panda_shared
    external: true
